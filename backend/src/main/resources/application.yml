# ===========================
# SERVER CONFIGURATION
# ===========================
server:
  port: 8080

# ===========================
# DATASOURCE / DATABASE
# ===========================
spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/guardian?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:emmanuel}
    driver-class-name: org.mariadb.jdbc.Driver
    initialization-mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  flyway:
    # Disabled for local dev when using MariaDB 11.x which may be
    # unsupported by the bundled Flyway version. Enable in production
    # or after upgrading Flyway.
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

# ===========================
# CORS CONFIGURATION
# ===========================
cors:
  allowed-origins: "http://localhost:3000"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true

# ===========================
# GUARDIAN APP / CUSTOM CONFIG
# ===========================
guardian:
  strictMode: true
  openrouter:
    apiKey: ${OPENROUTER_API_KEY:}
    baseUrl: ${OPENROUTER_BASE_URL:https://api.openrouter.ai}
    model: ${OPENROUTER_MODEL:claude-haiku-4.5}
